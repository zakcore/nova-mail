<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Message – Nova Mail</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/ui.js" defer></script>
  <script type="module" src="js/pages/message.js"></script>
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <button type="button" class="menu-toggle" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span class="app-brand">Nova Mail</span>
      <div class="user-badge">
        <span class="user-name" id="user-name"></span>
        <span class="avatar avatar-32" id="user-avatar" aria-hidden="true"></span>
      </div>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
      <ul class="sidebar-menu">
          <li><a class="sidebar-link" href="nouveau.html" data-nav="nouveau">Nouveau message</a></li>
          <li><a class="sidebar-link is-active" aria-current="page" href="reception.html" data-nav="reception">Réception <span class="badge-count" id="count-reception" hidden></span></a></li>
          <li><a class="sidebar-link" href="envoyes.html" data-nav="envoyes">Envoyés</a></li>
      </ul>
      <p class="sidebar-section-title" id="folders-title">Dossiers</p>
      <ul class="sidebar-menu sidebar-folders" id="folder-list" aria-labelledby="folders-title"></ul>
      <button type="button" class="sidebar-add" data-open-modal="modal-new-folder">+ Nouveau dossier</button>
      <ul class="sidebar-menu">
          <li><a class="sidebar-link" href="contacts.html" data-nav="contacts">Contacts</a></li>
          <li><a class="sidebar-link" href="profil.html" data-nav="profil">Profil</a></li>
      </ul>
      <div class="sidebar-footer">
        <a class="sidebar-link" href="index.html" id="logout-link">Déconnexion</a>
      </div>
    </nav>
    <main class="app-main">
      <p class="list-state" id="message-loading">Chargement…</p>

      <div class="empty-state" id="message-not-found" hidden>
        <p>Ce message est introuvable.</p>
        <p><a href="reception.html">Retour à la boîte de réception</a></p>
      </div>

      <article class="message-detail" id="message-detail" hidden>
        <div class="message-toolbar">
          <a class="back-link" href="reception.html" id="back-link">← Retour</a>
          <div class="toolbar-actions">
            <button type="button" class="btn btn-secondary" id="btn-unread" hidden>Marquer comme non lu</button>
            <button type="button" class="btn btn-danger" id="btn-delete">Supprimer</button>
          </div>
        </div>

        <h1 class="message-subject" id="message-subject"></h1>
        <dl class="message-meta">
          <div><dt>De :</dt> <dd id="message-from"></dd></div>
          <div><dt>À :</dt> <dd id="message-to"></dd></div>
          <div><dt>Le :</dt> <dd id="message-date"></dd></div>
        </dl>

        <div class="message-body" id="message-body"></div>

        <section class="message-section" id="attachments-section" aria-labelledby="attachments-title" hidden>
          <h2 class="message-section-title" id="attachments-title">Pièces jointes</h2>
          <ul class="attachment-list" id="attachment-list"></ul>
        </section>

        <section class="message-section" id="move-section">
          <form class="move-form" id="move-form" novalidate>
            <label for="move-folder">Classer dans un dossier :</label>
            <select class="input" id="move-folder" name="idDossier"></select>
            <button type="submit" class="btn btn-primary">Déplacer</button>
          </form>
        </section>
      </article>
    </main>
  </div>

  <div class="modal" id="modal-new-folder" role="dialog" aria-modal="true" aria-labelledby="modal-new-folder-title">
    <form class="modal-panel" id="new-folder-form" novalidate>
      <h2 class="modal-title" id="modal-new-folder-title">Nouveau dossier</h2>
      <div class="field">
        <label class="field-label" for="new-folder-name">Nom du dossier *</label>
        <input class="input" type="text" id="new-folder-name" name="nom" maxlength="80" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
        <button type="submit" class="btn btn-primary">Créer</button>
      </div>
    </form>
  </div>

  <div class="modal" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title" aria-describedby="modal-confirm-text">
    <div class="modal-panel">
      <h2 class="modal-title" id="modal-confirm-title"></h2>
      <p id="modal-confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
        <button type="button" class="btn btn-danger-solid" id="modal-confirm-ok">Supprimer</button>
      </div>
    </div>
  </div>
</body>
</html>
