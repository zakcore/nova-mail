<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Nouveau message – Nova Mail</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/ui.js" defer></script>
  <script type="module" src="js/pages/nouveau.js"></script>
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <button type="button" class="menu-toggle" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span class="app-brand">Nova Mail</span>
      <div class="user-badge">
        <span class="user-name" id="user-name"></span>
        <span class="avatar avatar-32" id="user-avatar" aria-hidden="true"></span>
      </div>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
      <ul class="sidebar-menu">
          <li><a class="sidebar-link is-active" aria-current="page" href="nouveau.html" data-nav="nouveau">Nouveau message</a></li>
          <li><a class="sidebar-link" href="reception.html" data-nav="reception">Réception <span class="badge-count" id="count-reception" hidden></span></a></li>
          <li><a class="sidebar-link" href="envoyes.html" data-nav="envoyes">Envoyés</a></li>
      </ul>
      <p class="sidebar-section-title" id="folders-title">Dossiers</p>
      <ul class="sidebar-menu sidebar-folders" id="folder-list" aria-labelledby="folders-title"></ul>
      <button type="button" class="sidebar-add" data-open-modal="modal-new-folder">+ Nouveau dossier</button>
      <ul class="sidebar-menu">
          <li><a class="sidebar-link" href="contacts.html" data-nav="contacts">Contacts</a></li>
          <li><a class="sidebar-link" href="profil.html" data-nav="profil">Profil</a></li>
      </ul>
      <div class="sidebar-footer">
        <a class="sidebar-link" href="index.html" id="logout-link">Déconnexion</a>
      </div>
    </nav>
    <main class="app-main">
      <div class="page-head">
        <h1 class="page-title">Nouveau message</h1>
      </div>

      <form class="compose-form" id="compose-form" novalidate>
        <div class="field">
          <label class="field-label" for="compose-to">Destinataire *</label>
          <input class="input" type="text" id="compose-to" name="destinataires" placeholder="nom@exemple.com" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="compose-suggestions" aria-describedby="compose-to-help">
          <ul class="suggestions" id="compose-suggestions" role="listbox" aria-label="Suggestions de contacts" hidden></ul>
          <p class="field-help" id="compose-to-help">Séparez plusieurs adresses par une virgule.</p>
        </div>

        <div class="field">
          <label class="field-label" for="compose-subject">Objet *</label>
          <input class="input" type="text" id="compose-subject" name="objet" maxlength="255">
        </div>

        <div class="field">
          <label class="field-label" for="compose-body">Message *</label>
          <textarea class="input" id="compose-body" name="contenu" rows="12" placeholder="Bonjour,"></textarea>
        </div>

        <ul class="chip-list" id="attachment-chips" aria-label="Pièces jointes" hidden></ul>
        <input type="file" id="compose-files" multiple hidden>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-send">Envoyer</button>
          <button type="button" class="btn btn-secondary" id="btn-attach">JOINDRE</button>
        </div>
      </form>
    </main>
  </div>

  <div class="modal" id="modal-new-folder" role="dialog" aria-modal="true" aria-labelledby="modal-new-folder-title">
    <form class="modal-panel" id="new-folder-form" novalidate>
      <h2 class="modal-title" id="modal-new-folder-title">Nouveau dossier</h2>
      <div class="field">
        <label class="field-label" for="new-folder-name">Nom du dossier *</label>
        <input class="input" type="text" id="new-folder-name" name="nom" maxlength="80" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
        <button type="submit" class="btn btn-primary">Créer</button>
      </div>
    </form>
  </div>

  <div class="modal" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title" aria-describedby="modal-confirm-text">
    <div class="modal-panel">
      <h2 class="modal-title" id="modal-confirm-title"></h2>
      <p id="modal-confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
        <button type="button" class="btn btn-danger-solid" id="modal-confirm-ok">Supprimer</button>
      </div>
    </div>
  </div>
</body>
</html>
